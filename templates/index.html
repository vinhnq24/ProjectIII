<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Quality Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* CUSTOM SCROLLBAR */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 17, 23, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(26, 20, 48, 0.8) 0%, rgba(15, 17, 23, 1) 90%);
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      text-transform: uppercase;
    }

    /* STATUS BAR */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      font-size: 0.85rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 20px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
    }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.8s infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        box-shadow: 0 0 4px #10b981;
      }
      100% {
        transform: scale(1.1);
        box-shadow: 0 0 14px #10b981;
      }
    }

    /* GLASS CONTAINER UTILITY */
    .glass-panel {
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* METRIC CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px 16px;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    }

    .card.good:hover {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
    }
    .card.normal:hover {
      border-color: rgba(234, 179, 8, 0.4);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
    }
    .card.bad:hover {
      border-color: rgba(249, 115, 22, 0.4);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.15);
    }
    .card.danger:hover {
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
    }

    .card-label {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .card-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      transition: color 0.3s;
    }

    .card-unit {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 4px;
      font-weight: 400;
    }

    /* AI PANEL */
    #ai-panel {
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 24px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    #ai-panel:hover {
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
    }

    #ai-panel h2 {
      font-size: 0.8rem;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      width: 100%;
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    #ai-panel h2::before {
      content: '✦';
      color: #60a5fa;
      animation: spin 3s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .ai-item {
      flex: 1;
      min-width: 140px;
      text-align: center;
      padding: 12px 8px;
      background: rgba(255, 255, 255, 0.015);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      transition: all 0.25s ease;
    }

    .ai-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }

    .ai-item .ai-label {
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .ai-item .ai-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
    }

    .color-good   { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
    .color-normal { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
    .color-bad    { color: #f97316; text-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }
    .color-danger { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .color-anom   { color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }

    /* CHART */
    #chart-container {
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px;
      margin-bottom: 28px;
    }

    #chart-container:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    #chart-container h2 {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
      font-weight: 600;
    }

    canvas { max-height: 280px; }

    /* TABLE */
    #table-container {
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 24px;
      overflow-x: auto;
    }

    #table-container:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    #table-container h2 {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      color: #94a3b8;
      font-weight: 600;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 2px solid rgba(255, 255, 255, 0.06);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
    }

    tr:hover td {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.015);
    }

    tr:last-child td { border-bottom: none; }

    /* TRAIN BUTTON */
    #train-btn {
      display: block;
      margin: 28px auto 0;
      padding: 12px 36px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.03em;
    }

    #train-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5), 0 0 10px rgba(59, 130, 246, 0.3);
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
    }

    #train-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    #train-btn:disabled {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: not-allowed;
      box-shadow: none;
    }

    #train-msg {
      text-align: center;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>

<h1>AIR QUALITY MONITOR</h1>

<div id="status-bar">
  <span id="status-dot"></span>
  <span id="status-text">Đang kết nối...</span>
  <span id="record-count"></span>
</div>

<!-- METRIC CARDS -->
<div class="cards">
  <div class="card" id="card-pm25">
    <div class="card-label">PM2.5</div>
    <div class="card-value" id="val-pm25">--</div>
    <div class="card-unit">µg/m³</div>
  </div>
  <div class="card" id="card-pm10">
    <div class="card-label">PM10</div>
    <div class="card-value" id="val-pm10">--</div>
    <div class="card-unit">µg/m³</div>
  </div>
  <div class="card" id="card-temp">
    <div class="card-label">Nhiệt độ</div>
    <div class="card-value" id="val-temp">--</div>
    <div class="card-unit">°C</div>
  </div>
  <div class="card" id="card-hum">
    <div class="card-label">Độ ẩm</div>
    <div class="card-value" id="val-hum">--</div>
    <div class="card-unit">%</div>
  </div>
  <div class="card" id="card-mq">
    <div class="card-label">MQ135</div>
    <div class="card-value" id="val-mq">--</div>
    <div class="card-unit">raw</div>
  </div>
</div>

<!-- AI PANEL -->
<div id="ai-panel">
  <h2>AI Predictions</h2>
  <div class="ai-item">
    <div class="ai-label">Mức độ không khí</div>
    <div class="ai-value" id="ai-class">--</div>
  </div>
  <div class="ai-item">
    <div class="ai-label">PM2.5 dự đoán tiếp theo</div>
    <div class="ai-value" id="ai-forecast">--</div>
  </div>
  <div class="ai-item">
    <div class="ai-label">Bất thường</div>
    <div class="ai-value" id="ai-anomaly">--</div>
  </div>
  <div class="ai-item">
    <div class="ai-label">Cảnh báo</div>
    <div class="ai-value" id="ai-alert">--</div>
  </div>
</div>

<!-- CHART -->
<div id="chart-container">
  <h2>Biểu đồ PM2.5 & PM10</h2>
  <canvas id="chart"></canvas>
</div>

<!-- TABLE -->
<div id="table-container">
  <h2>Dữ liệu gần nhất</h2>
  <table>
    <thead>
      <tr>
        <th>Thời gian</th>
        <th>PM2.5</th>
        <th>PM10</th>
        <th>Nhiệt độ</th>
        <th>Độ ẩm</th>
        <th>MQ135</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="6" style="text-align:center;color:#475569">Đang tải...</td></tr>
    </tbody>
  </table>
</div>

<!-- TRAIN BUTTON -->
<button id="train-btn" onclick="triggerTrain()">Train AI Model</button>
<div id="train-msg"></div>

<script>
const API = "";
let chart = null;

// =====================================================
// CHART SETUP
// =====================================================
function initChart() {
  const ctx = document.getElementById("chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: "PM2.5",
          data: [],
          borderColor: "#3b82f6",
          backgroundColor: "#3b82f620",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: true,
        },
        {
          label: "PM10",
          data: [],
          borderColor: "#f97316",
          backgroundColor: "#f9731620",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: true,
        }
      ]
    },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { labels: { color: "#64748b", boxWidth: 12 } }
      },
      scales: {
        x: {
          ticks: {
            color: "#475569",
            maxTicksLimit: 8,
            maxRotation: 0,
            callback: (v, i, ticks) => {
              const label = chart.data.labels[i];
              return label ? label.substring(11, 16) : "";
            }
          },
          grid: { color: "#1e2130" }
        },
        y: {
          ticks: { color: "#475569" },
          grid: { color: "#2d3348" }
        }
      }
    }
  });
}

// =====================================================
// FETCH DATA
// =====================================================
async function fetchDashboard() {
  try {
    const res  = await fetch(`${API}/dashboard?limit=60`);
    const json = await res.json();

    if (json.status !== "ok") return;

    updateCards(json.latest);
    updateAI(json.predictions);
    updateChart(json.rows);
    updateTable(json.rows.slice(0, 15));
    updateStatus(json.count);

  } catch (e) {
    document.getElementById("status-dot").style.background = "#ef4444";
    document.getElementById("status-text").textContent = "Mất kết nối server";
  }
}

// =====================================================
// UPDATE UI
// =====================================================
function updateCards(latest) {
  if (!latest) return;

  document.getElementById("val-pm25").textContent = latest.pm25.toFixed(1);
  document.getElementById("val-pm10").textContent = latest.pm10.toFixed(1);
  document.getElementById("val-temp").textContent = latest.temp.toFixed(1);
  document.getElementById("val-hum").textContent  = latest.hum.toFixed(0);
  document.getElementById("val-mq").textContent   = latest.mq.toFixed(0);
}

function updateAI(pred) {
  if (!pred) return;

  const alertLabel = pred.alert_level?.label || "--";
  const alertLevel = pred.alert_level?.level ?? -1;

  const colorMap = { Good: "color-good", Normal: "color-normal", Bad: "color-bad", Danger: "color-danger" };
  const colorClass = colorMap[alertLabel] || "";

  // Classify
  const cls = pred.classify?.air_class || (pred.classify?.available === false ? "No model" : "--");
  const clsEl = document.getElementById("ai-class");
  clsEl.textContent = cls;
  clsEl.className = `ai-value ${colorMap[cls] || ""}`;

  // Forecast
  const fc = pred.forecast?.pm25_next;
  document.getElementById("ai-forecast").textContent =
    fc !== null && fc !== undefined ? `${fc} µg/m³` : "No model";

  // Anomaly
  const anomEl = document.getElementById("ai-anomaly");
  if (pred.anomaly?.available === false) {
    anomEl.textContent = "No model";
    anomEl.className = "ai-value";
  } else if (pred.anomaly?.is_anomaly) {
    anomEl.textContent = "⚠ Bất thường";
    anomEl.className = "ai-value color-anom";
  } else {
    anomEl.textContent = "Bình thường";
    anomEl.className = "ai-value color-good";
  }

  // Alert
  const alertEl = document.getElementById("ai-alert");
  alertEl.textContent = alertLabel;
  alertEl.className = `ai-value ${colorClass}`;
}

function updateChart(rows) {
  if (!rows || !chart) return;

  const asc    = [...rows].reverse();
  const labels = asc.map(r => r.timestamp);
  const pm25   = asc.map(r => r.pm25);
  const pm10   = asc.map(r => r.pm10);

  chart.data.labels             = labels;
  chart.data.datasets[0].data  = pm25;
  chart.data.datasets[1].data  = pm10;
  chart.update("none");
}

function updateTable(rows) {
  if (!rows) return;

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.timestamp}</td>
      <td>${r.pm25.toFixed(1)}</td>
      <td>${r.pm10.toFixed(1)}</td>
      <td>${r.temp.toFixed(1)}</td>
      <td>${r.hum.toFixed(0)}</td>
      <td>${r.mq.toFixed(0)}</td>
    </tr>
  `).join("");
}

function updateStatus(count) {
  document.getElementById("status-dot").style.background = "#22c55e";
  document.getElementById("status-text").textContent = "Đang hoạt động";
  document.getElementById("record-count").textContent = `• ${count} bản ghi`;
}

// =====================================================
// TRAIN
// =====================================================
async function triggerTrain() {
  const btn = document.getElementById("train-btn");
  const msg = document.getElementById("train-msg");

  btn.disabled = true;
  btn.textContent = "Đang train...";
  msg.textContent = "Training bắt đầu, có thể mất 1-2 phút...";

  try {
    const res  = await fetch(`${API}/train`, { method: "POST" });
    const json = await res.json();
    msg.textContent = json.message || "Xong!";
  } catch (e) {
    msg.textContent = "Lỗi kết nối server";
  }

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = "Train AI Model";
  }, 5000);
}

// =====================================================
// INIT
// =====================================================
initChart();
fetchDashboard();
setInterval(fetchDashboard, 5000);
</script>
</body>
</html>
