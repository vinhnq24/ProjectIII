<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Quality Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 20px;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    /* STATUS BAR */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: #64748b;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* METRIC CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      background: #1e2130;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #2d3348;
      transition: border-color 0.3s;
    }

    .card.good    { border-color: #22c55e44; }
    .card.normal  { border-color: #eab30844; }
    .card.bad     { border-color: #f9731644; }
    .card.danger  { border-color: #ef444444; }

    .card-label {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .card-unit {
      font-size: 0.7rem;
      color: #475569;
      margin-top: 2px;
    }

    /* AI PANEL */
    #ai-panel {
      background: #1e2130;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      border: 1px solid #2d3348;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    #ai-panel h2 {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      width: 100%;
      margin-bottom: 4px;
    }

    .ai-item {
      flex: 1;
      min-width: 120px;
      text-align: center;
    }

    .ai-item .ai-label {
      font-size: 0.68rem;
      color: #475569;
      margin-bottom: 4px;
    }

    .ai-item .ai-value {
      font-size: 1.1rem;
      font-weight: 500;
    }

    .color-good   { color: #22c55e; }
    .color-normal { color: #eab308; }
    .color-bad    { color: #f97316; }
    .color-danger { color: #ef4444; }
    .color-anom   { color: #a855f7; }

    /* CHART */
    #chart-container {
      background: #1e2130;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid #2d3348;
    }

    #chart-container h2 {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    canvas { max-height: 240px; }

    /* TABLE */
    #table-container {
      background: #1e2130;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #2d3348;
      overflow-x: auto;
    }

    #table-container h2 {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th {
      color: #475569;
      font-weight: 500;
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid #2d3348;
    }

    td {
      padding: 6px 10px;
      border-bottom: 1px solid #1a1f2e;
      color: #94a3b8;
    }

    tr:last-child td { border-bottom: none; }

    /* TRAIN BUTTON */
    #train-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 28px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #train-btn:hover   { background: #2563eb; }
    #train-btn:disabled { background: #374151; cursor: not-allowed; }

    #train-msg {
      text-align: center;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

<h1>AIR QUALITY MONITOR</h1>

<div id="status-bar">
  <span id="status-dot"></span>
  <span id="status-text">Đang kết nối...</span>
  <span id="record-count"></span>
</div>

<!-- METRIC CARDS -->
<div class="cards">
  <div class="card" id="card-pm25">
    <div class="card-label">PM2.5</div>
    <div class="card-value" id="val-pm25">--</div>
    <div class="card-unit">µg/m³</div>
  </div>
  <div class="card" id="card-pm10">
    <div class="card-label">PM10</div>
    <div class="card-value" id="val-pm10">--</div>
    <div class="card-unit">µg/m³</div>
  </div>
  <div class="card" id="card-temp">
    <div class="card-label">Nhiệt độ</div>
    <div class="card-value" id="val-temp">--</div>
    <div class="card-unit">°C</div>
  </div>
  <div class="card" id="card-hum">
    <div class="card-label">Độ ẩm</div>
    <div class="card-value" id="val-hum">--</div>
    <div class="card-unit">%</div>
  </div>
  <div class="card" id="card-mq">
    <div class="card-label">MQ135</div>
    <div class="card-value" id="val-mq">--</div>
    <div class="card-unit">raw</div>
  </div>
</div>

<!-- AI PANEL -->
<div id="ai-panel">
  <h2>AI Predictions</h2>
  <div class="ai-item">
    <div class="ai-label">Mức độ không khí</div>
    <div class="ai-value" id="ai-class">--</div>
  </div>
  <div class="ai-item">
    <div class="ai-label">PM2.5 dự đoán tiếp theo</div>
    <div class="ai-value" id="ai-forecast">--</div>
  </div>
  <div class="ai-item">
    <div class="ai-label">Bất thường</div>
    <div class="ai-value" id="ai-anomaly">--</div>
  </div>
  <div class="ai-item">
    <div class="ai-label">Cảnh báo</div>
    <div class="ai-value" id="ai-alert">--</div>
  </div>
</div>

<!-- CHART -->
<div id="chart-container">
  <h2>Biểu đồ PM2.5 & PM10</h2>
  <canvas id="chart"></canvas>
</div>

<!-- TABLE -->
<div id="table-container">
  <h2>Dữ liệu gần nhất</h2>
  <table>
    <thead>
      <tr>
        <th>Thời gian</th>
        <th>PM2.5</th>
        <th>PM10</th>
        <th>Nhiệt độ</th>
        <th>Độ ẩm</th>
        <th>MQ135</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="6" style="text-align:center;color:#475569">Đang tải...</td></tr>
    </tbody>
  </table>
</div>

<!-- TRAIN BUTTON -->
<button id="train-btn" onclick="triggerTrain()">Train AI Model</button>
<div id="train-msg"></div>

<script>
const API = "";
let chart = null;

// =====================================================
// CHART SETUP
// =====================================================
function initChart() {
  const ctx = document.getElementById("chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: "PM2.5",
          data: [],
          borderColor: "#3b82f6",
          backgroundColor: "#3b82f620",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: true,
        },
        {
          label: "PM10",
          data: [],
          borderColor: "#f97316",
          backgroundColor: "#f9731620",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: true,
        }
      ]
    },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { labels: { color: "#64748b", boxWidth: 12 } }
      },
      scales: {
        x: {
          ticks: {
            color: "#475569",
            maxTicksLimit: 8,
            maxRotation: 0,
            callback: (v, i, ticks) => {
              const label = chart.data.labels[i];
              return label ? label.substring(11, 16) : "";
            }
          },
          grid: { color: "#1e2130" }
        },
        y: {
          ticks: { color: "#475569" },
          grid: { color: "#2d3348" }
        }
      }
    }
  });
}

// =====================================================
// FETCH DATA
// =====================================================
async function fetchDashboard() {
  try {
    const res  = await fetch(`${API}/dashboard?limit=60`);
    const json = await res.json();

    if (json.status !== "ok") return;

    updateCards(json.latest);
    updateAI(json.predictions);
    updateChart(json.rows);
    updateTable(json.rows.slice(0, 15));
    updateStatus(json.count);

  } catch (e) {
    document.getElementById("status-dot").style.background = "#ef4444";
    document.getElementById("status-text").textContent = "Mất kết nối server";
  }
}

// =====================================================
// UPDATE UI
// =====================================================
function updateCards(latest) {
  if (!latest) return;

  document.getElementById("val-pm25").textContent = latest.pm25.toFixed(1);
  document.getElementById("val-pm10").textContent = latest.pm10.toFixed(1);
  document.getElementById("val-temp").textContent = latest.temp.toFixed(1);
  document.getElementById("val-hum").textContent  = latest.hum.toFixed(0);
  document.getElementById("val-mq").textContent   = latest.mq.toFixed(0);
}

function updateAI(pred) {
  if (!pred) return;

  const alertLabel = pred.alert_level?.label || "--";
  const alertLevel = pred.alert_level?.level ?? -1;

  const colorMap = { Good: "color-good", Normal: "color-normal", Bad: "color-bad", Danger: "color-danger" };
  const colorClass = colorMap[alertLabel] || "";

  // Classify
  const cls = pred.classify?.air_class || (pred.classify?.available === false ? "No model" : "--");
  const clsEl = document.getElementById("ai-class");
  clsEl.textContent = cls;
  clsEl.className = `ai-value ${colorMap[cls] || ""}`;

  // Forecast
  const fc = pred.forecast?.pm25_next;
  document.getElementById("ai-forecast").textContent =
    fc !== null && fc !== undefined ? `${fc} µg/m³` : "No model";

  // Anomaly
  const anomEl = document.getElementById("ai-anomaly");
  if (pred.anomaly?.available === false) {
    anomEl.textContent = "No model";
    anomEl.className = "ai-value";
  } else if (pred.anomaly?.is_anomaly) {
    anomEl.textContent = "⚠ Bất thường";
    anomEl.className = "ai-value color-anom";
  } else {
    anomEl.textContent = "Bình thường";
    anomEl.className = "ai-value color-good";
  }

  // Alert
  const alertEl = document.getElementById("ai-alert");
  alertEl.textContent = alertLabel;
  alertEl.className = `ai-value ${colorClass}`;
}

function updateChart(rows) {
  if (!rows || !chart) return;

  const asc    = [...rows].reverse();
  const labels = asc.map(r => r.timestamp);
  const pm25   = asc.map(r => r.pm25);
  const pm10   = asc.map(r => r.pm10);

  chart.data.labels             = labels;
  chart.data.datasets[0].data  = pm25;
  chart.data.datasets[1].data  = pm10;
  chart.update("none");
}

function updateTable(rows) {
  if (!rows) return;

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.timestamp}</td>
      <td>${r.pm25.toFixed(1)}</td>
      <td>${r.pm10.toFixed(1)}</td>
      <td>${r.temp.toFixed(1)}</td>
      <td>${r.hum.toFixed(0)}</td>
      <td>${r.mq.toFixed(0)}</td>
    </tr>
  `).join("");
}

function updateStatus(count) {
  document.getElementById("status-dot").style.background = "#22c55e";
  document.getElementById("status-text").textContent = "Đang hoạt động";
  document.getElementById("record-count").textContent = `• ${count} bản ghi`;
}

// =====================================================
// TRAIN
// =====================================================
async function triggerTrain() {
  const btn = document.getElementById("train-btn");
  const msg = document.getElementById("train-msg");

  btn.disabled = true;
  btn.textContent = "Đang train...";
  msg.textContent = "Training bắt đầu, có thể mất 1-2 phút...";

  try {
    const res  = await fetch(`${API}/train`, { method: "POST" });
    const json = await res.json();
    msg.textContent = json.message || "Xong!";
  } catch (e) {
    msg.textContent = "Lỗi kết nối server";
  }

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = "Train AI Model";
  }, 5000);
}

// =====================================================
// INIT
// =====================================================
initChart();
fetchDashboard();
setInterval(fetchDashboard, 5000);
</script>
</body>
</html>
